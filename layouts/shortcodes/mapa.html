<div id="map" style="height: 500px; width: 100%; border-radius: 15px; z-index: 1;"></div>

<script>
  // Počkáme, až se načte Leaflet
  document.addEventListener("DOMContentLoaded", function() {
    var map = L.map('map', { 
        scrollWheelZoom: false,
        minZoom: 2
    }).setView([15, 20], 2); // Pohled na svět

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Tady definuješ země a odkazy na jejich podstránky
    var locations = [
      { name: "Thajsko", lat: 15.87, lng: 100.99, link: "/zeme/thajsko/" },
      { name: "Brazílie", lat: -14.23, lng: -51.92, link: "/zeme/brazilie/" },
      { name: "Peru", lat: -9.19, lng: -75.01, link: "/zeme/peru/" }
    ];

    locations.forEach(function(loc) {
      var marker = L.marker([loc.lat, loc.lng]).addTo(map);
      
      // Místo bubliny uděláme přímý proklik při kliknutí na bod
      marker.on('click', function() {
        window.location.href = loc.link;
      });

      // Volitelně: Bublina při najetí myší
      marker.bindTooltip("<b>" + loc.name + "</b>", { direction: 'top', offset: [0, -10] });
    });
  });
</script>
