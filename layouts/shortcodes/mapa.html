<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Mapa bez okrajů -->
<div id="map" style="height: 600px; width: 100%; background: #ffffff; z-index: 1;"></div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    var map = L.map('map', { 
      scrollWheelZoom: false,
      minZoom: 2 
    }).setView([20, 10], 2);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

    var locations = [
      { name: "Thajsko", lat: 15.87, lng: 100.99, link: "/zeme/thajsko/", hasContent: true },
      { name: "Brazílie", lat: -14.23, lng: -51.92, link: "/zeme/brazilie/", hasContent: true },
      { name: "Peru", lat: -9.19, lng: -75.01, link: "#", hasContent: false } // Příklad země bez textu
    ];

    locations.forEach(function(loc) {
      // Výběr barvy: Zelená pro obsah, Šedá pro prázdné
      var markerColor = loc.hasContent ? "#28a745" : "#6c757d";

      // Vytvoření vlastního "puntíku" (podobné MUNI)
      var customIcon = L.divIcon({
        className: 'custom-marker',
        html: `<div style="background-color: ${markerColor}; width: 15px; height: 15px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 5px rgba(0,0,0,0.3);"></div>`,
        iconSize: [15, 15]
      });

      var marker = L.marker([loc.lat, loc.lng], { icon: customIcon }).addTo(map);
      
      if (loc.hasContent) {
        marker.on('click', function() {
          window.location.href = loc.link;
        });
        marker.bindTooltip(`<b>${loc.name}</b><br>Klikni pro články`, { direction: 'top' });
      } else {
        marker.bindTooltip(`<b>${loc.name}</b><br>Brzy v džungli!`, { direction: 'top' });
      }
    });
  });
</script>

<style>
  /* Odstranění stínu pod vlastním puntíkem */
  .custom-marker { background: none; border: none; }
</style>
