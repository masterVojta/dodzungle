<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<div id="map" style="height: 500px; width: 100%; background: #f0f0f0; border-radius: 10px;"></div>

<script>
  function initMap() {
    if (typeof L === 'undefined') {
      setTimeout(initMap, 100); // Zkus to znovu za 100ms, pokud Leaflet ještě nedorazil
      return;
    }
    var map = L.map('map').setView([15, 20], 2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Testovací bod
    L.marker([15.87, 100.99]).addTo(map).bindPopup('Thajsko');
  }
  initMap();
</script>
