# -- Theme Options --
# These options control how the theme functions and allow you to
# customise the display of your website.
#
# Refer to the theme docs for more details about each of these parameters.
# https://nunocoracao.github.io/blowfish/docs/configuration/#theme-parameters

colorScheme = "forest"
defaultAppearance = "light" # valid options: light or dark
autoSwitchAppearance = true
primaryColor = "#ADE8F4" # Ta tvoje tyrkysová

enableSearch = true
enableCodeCopy = true

# mainSections = ["section1", "section2"]
# robots = ""

[header]
  layout = "basic"
  showLogo = true
  # logo = "/img/logo.png" 
  showName = true # Pokud chceš vedle loga i text "Do džungle"
  

[footer]
 # showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "background" # Nebo "page", pokud nechceš obrázek na pozadí
  showRecent = true     # TENTO ŘÁDEK JE KLÍČOVÝ - zapne výpis článků
  showRecentItems = 5   # Počet článků, které se mají ukázat
  showMoreLink = true   # Zobrazí odkaz "Všechny články"
  showMoreLinkDest = "/posts"
  cardView = true       # Články budou v hezkých kartách s obrázky
  cardViewScreenWidth = true # Toto roztáhne karty na max
  layout = "page"            # Změň na "page", pokud tam byla "profile"



[article]
  showDate = true
  #showViews = true
  #showLikes = true
  showDateUpdated = false
  showAuthor = true
  showHero = true
  heroStyle = "basic" # valid options: basic, big, background
  showBreadcrumbs = true
  showDraftLabel = true
  showEdit = false
  # editURL = "https://github.com/username/repo/"
  editAppendPath = true
  seriesOpened = false
  showHeadingAnchors = true
  showPagination = true
  invertPagination = false
  showReadingTime = true
  showTableOfContents = true
  showTaxonomies = false 
  showAuthorsBadges = false 
  showWordCount = true
  showSummary = true
  sharingLinks = [ "linkedin", "twitter", "whatsapp", "pinterest", "reddit", "facebook", "email"]

[list]
  showBreadcrumbs = false
  showSummary = true
  showTableOfContents = false
  showCards = false
  groupByYear = true
  cardView = false
  cardViewScreenWidth = false

[sitemap]
  excludedKinds = []

[taxonomy]
  showTermCount = true

